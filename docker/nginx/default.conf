server {
    listen 80;
    index index.php index.html;
    root /var/www/public;

    # The visual assets were kept in the original VivaBem SPA directory,
    # while Laravel's front controller lives in /public.
    location ^~ /assets/ {
        alias /var/www/public/vivabem-spa/assets/;
    }

    location ^~ /css/ {
        alias /var/www/public/vivabem-spa/css/;
    }

    location ^~ /js/ {
        alias /var/www/public/vivabem-spa/js/;
    }

    location ^~ /fonts/ {
        alias /var/www/public/vivabem-spa/fonts/;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
