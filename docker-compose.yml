services:

  app:
    build: .
    container_name: vivabemspa-app
    working_dir: /var/www
    volumes:
      - ./src:/var/www

  nginx:
    image: nginx:latest
    container_name: vivabemspa-nginx
    ports:
      - "8003:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: vivabemspa-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vivabem
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: vivabemspa-phpmyadmin
    restart: always
    ports:
      - "8083:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql

volumes:
  mysql_data:
